name: tests
# The shared tests of every Unseenet Python repository (unseenet#545, #42).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    uses: unseenet/.github/.github/workflows/python-tests.yml@main
    with:
      python: '["3.11", "3.13"]'
      setup: sh -n deploy/install.sh

  core-main:
    # The next core release (unseenet main), so this repo is ready the day it is
    # released (unseenet/unseenet#386 section 4).
    uses: unseenet/.github/.github/workflows/python-tests.yml@main
    with:
      python: '["3.13"]'
      core-main: true

  docs:
    # docs/ checked strictly, as unseenet-docs gathers it into unseenet.org
    uses: unseenet/.github/.github/workflows/docs-check.yml@main
